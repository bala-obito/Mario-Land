function build(){

function reset(full){

function start(){aud();

function nextLvl(){carry=p.big;if(++lvl>1500){lvl=1;world++}if(world>2e9){state='end';return}reset(0);state='intro';it=100}
const sol=(i,j)=>i<0||i>=C?true:(j<0||j>=RW)?false:(map[j][i]>0&&map[j][i]!=8);

function bump(i,j){
